<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3f8;color:#172334}header{padding:16px 22px;background:#123d70;color:white}main{padding:16px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.bar button,.actions button,.edit-actions button{padding:11px 18px;border:0;border-radius:7px;color:white;font-weight:bold;cursor:pointer}.train{background:#6f42c1}.approve{background:#24834c}.reject,.clear{background:#9b3e34}.restore{background:#e66c18}.card{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 8px #1233}.canvas{position:relative;background:#172334;touch-action:none}.canvas img{display:block;width:100%;max-height:620px;object-fit:contain}.canvas svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.post{stroke:#ff9500;stroke-width:5;vector-effect:non-scaling-stroke}.post.manual{stroke:#24d06f}.hit{stroke:transparent;stroke-width:20;vector-effect:non-scaling-stroke;cursor:pointer}.meta{padding:10px 0;line-height:1.5}.edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{margin-left:auto;font-weight:bold}
</style></head><body><header><h2>Revisión rápida de imágenes reales</h2></header><main><div class="bar"><button class="train" id="train">Entrenar con aprobadas</button><span id="counts"></span><span class="status" id="status">Cargando…</span></div><div class="card" id="card"><div class="canvas"><img id="image"><svg id="overlay"></svg></div><div class="meta" id="meta"></div><div class="edit-actions"><button class="clear" id="clear">Limpiar líneas</button><button class="restore" id="restore">Restaurar sugerencias</button></div><div class="actions"><button class="reject" id="reject">Rechazar y siguiente</button><button class="approve" id="approve">Aprobar dibujo y siguiente</button></div></div></main><script>
let config,current,retries=0,marks=[],dragStart=null;const $=id=>document.getElementById(id);window.loadBatchReview=value=>{config=value;loadNext()};
async function loadNext(){try{const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/items?bucket=high_confidence&limit=1`);if(!r.ok){const error=await r.json();throw new Error(typeof error.detail==='string'?error.detail:JSON.stringify(error.detail||error))}const data=await r.json();retries=0;$('counts').textContent=`Pendientes: ${data.counts.pending} · Aprobadas: ${data.counts.approved} · Rechazadas: ${data.counts.rejected}`;current=data.items[0];if(!current){$('card').style.display='none';$('status').textContent='Terminaste las de confianza alta.';return}$('card').style.display='block';marks=current.posts.map(p=>({x:p.x_px,top_y:p.top_y_px,bottom_y:p.bottom_y_px,manual:false}));$('status').textContent='Cargando imagen…';$('image').onload=()=>$('status').textContent='Arrastra verticalmente para agregar; pulsa una línea para borrarla';$('image').onerror=()=>$('status').textContent='No se pudo abrir la imagen original';$('image').src=config.api_url+current.image_url;$('meta').textContent=`${current.filename} · ${current.source_path} · ${marks.length} postes · confianza ${Math.round(current.mean_post_confidence*100)}%`;$('overlay').setAttribute('viewBox',`0 0 ${current.analysis_size.width} ${current.analysis_size.height}`);redraw()}catch(error){retries++;$('status').textContent=`Esperando servicio local… intento ${retries}/10`;if(retries<10)setTimeout(loadNext,750);else $('status').textContent=`No fue posible cargar: ${error.message}`}}
function redraw(){const svg=$('overlay');svg.innerHTML='';marks.forEach((p,index)=>{const line=document.createElementNS(svg.namespaceURI,'line');line.setAttribute('x1',p.x);line.setAttribute('x2',p.x);line.setAttribute('y1',p.top_y);line.setAttribute('y2',p.bottom_y);line.setAttribute('class',`post${p.manual?' manual':''}`);const hit=line.cloneNode();hit.setAttribute('class','hit');hit.onpointerdown=event=>{event.stopPropagation();marks.splice(index,1);redraw()};svg.append(line,hit)});$('meta').textContent=`${current.filename} · ${current.source_path} · ${marks.length} postes`}
function svgPoint(event){const box=$('overlay').getBoundingClientRect(),size=current.analysis_size;return{x:(event.clientX-box.left)*size.width/box.width,y:(event.clientY-box.top)*size.height/box.height}}
$('overlay').onpointerdown=event=>{dragStart=svgPoint(event);$('overlay').setPointerCapture(event.pointerId)};$('overlay').onpointerup=event=>{if(!dragStart)return;const end=svgPoint(event),distance=Math.abs(end.y-dragStart.y);if(distance>current.analysis_size.height*.035){marks.push({x:(dragStart.x+end.x)/2,top_y:Math.min(dragStart.y,end.y),bottom_y:Math.max(dragStart.y,end.y),manual:true});redraw()}dragStart=null};
async function decide(decision){if(decision==='approved'&&!marks.length){$('status').textContent='Dibuja por lo menos un poste antes de aprobar';return}$('status').textContent='Guardando…';const posts=marks.map(p=>({x:p.x,top_y:p.top_y,bottom_y:p.bottom_y}));const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_name:current.record_name,decision,posts})});if(!r.ok){const e=await r.json();$('status').textContent=JSON.stringify(e.detail);return}loadNext()}
$('clear').onclick=()=>{marks=[];redraw()};$('restore').onclick=()=>{marks=current.posts.map(p=>({x:p.x_px,top_y:p.top_y_px,bottom_y:p.bottom_y_px,manual:false}));redraw()};$('approve').onclick=()=>decide('approved');$('reject').onclick=()=>decide('rejected');$('train').onclick=async()=>{$('status').textContent='Entrenando…';const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/train`,{method:'POST'}),d=await r.json();$('status').textContent=r.ok?`Entrenado: ${d.positive_samples} positivas, ${d.negative_samples} negativas`:`Error: ${JSON.stringify(d.detail)}`};document.addEventListener('DOMContentLoaded',()=>sketchup.ready());
</script></body></html>
