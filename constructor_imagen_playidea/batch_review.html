<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3f8;color:#172334}header{padding:16px 22px;background:#123d70;color:white}main{padding:16px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.bar button,.actions button{padding:11px 18px;border:0;border-radius:7px;color:white;font-weight:bold;cursor:pointer}.train{background:#6f42c1}.approve{background:#24834c}.reject{background:#9b3e34}.card{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 8px #1233}.canvas{position:relative;background:#172334}.canvas img{display:block;width:100%;max-height:620px;object-fit:contain}.canvas svg{position:absolute;inset:0;width:100%;height:100%}.post{stroke:#ff9500;stroke-width:5;vector-effect:non-scaling-stroke}.meta{padding:10px 0;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{margin-left:auto;font-weight:bold}
</style></head><body><header><h2>Revisión rápida de imágenes reales</h2></header><main><div class="bar"><button class="train" id="train">Entrenar con aprobadas</button><span id="counts"></span><span class="status" id="status">Cargando…</span></div><div class="card" id="card"><div class="canvas"><img id="image"><svg id="overlay"></svg></div><div class="meta" id="meta"></div><div class="actions"><button class="reject" id="reject">Rechazar y siguiente</button><button class="approve" id="approve">Aprobar postes y siguiente</button></div></div></main><script>
let config,current,retries=0;const $=id=>document.getElementById(id);window.loadBatchReview=value=>{config=value;loadNext()};
async function loadNext(){try{const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/items?bucket=high_confidence&limit=1`);if(!r.ok){const error=await r.json();throw new Error(typeof error.detail==='string'?error.detail:JSON.stringify(error.detail||error))}const data=await r.json();retries=0;$('counts').textContent=`Pendientes: ${data.counts.pending} · Aprobadas: ${data.counts.approved} · Rechazadas: ${data.counts.rejected}`;current=data.items[0];if(!current){$('card').style.display='none';$('status').textContent='Terminaste las de confianza alta.';return}$('card').style.display='block';$('status').textContent='Cargando imagen…';$('image').onload=()=>$('status').textContent='Revisa las líneas naranjas';$('image').onerror=()=>$('status').textContent='No se pudo abrir la imagen original';$('image').src=config.api_url+current.image_url;$('meta').textContent=`${current.filename} · ${current.source_path} · ${current.posts.length} postes · confianza ${Math.round(current.mean_post_confidence*100)}%`;$('overlay').setAttribute('viewBox',`0 0 ${current.analysis_size.width} ${current.analysis_size.height}`);$('overlay').innerHTML=current.posts.map(p=>`<line class="post" x1="${p.x_px}" x2="${p.x_px}" y1="${p.top_y_px}" y2="${p.bottom_y_px}"/>`).join('')}catch(error){retries++;$('status').textContent=`Esperando servicio local… intento ${retries}/10`;if(retries<10)setTimeout(loadNext,750);else $('status').textContent=`No fue posible cargar: ${error.message}`}}
async function decide(decision){$('status').textContent='Guardando…';const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({record_name:current.record_name,decision})});if(!r.ok){const e=await r.json();$('status').textContent=JSON.stringify(e.detail);return}loadNext()}
$('approve').onclick=()=>decide('approved');$('reject').onclick=()=>decide('rejected');$('train').onclick=async()=>{$('status').textContent='Entrenando…';const r=await fetch(`${config.api_url}/batch-review/${config.job_id}/train`,{method:'POST'}),d=await r.json();$('status').textContent=r.ok?`Entrenado: ${d.positive_samples} positivas, ${d.negative_samples} negativas`:`Error: ${JSON.stringify(d.detail)}`};document.addEventListener('DOMContentLoaded',()=>sketchup.ready());
</script></body></html>
